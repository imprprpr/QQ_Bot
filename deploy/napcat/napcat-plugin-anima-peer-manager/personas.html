<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnimaBot 人设与用户分配</title>
<style>:root{color-scheme:dark;font-family:system-ui,sans-serif;color:#ececf2;background:#14151b}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:28px}h1{font-size:25px}p,small{color:#b7bbcb;line-height:1.7}a{color:#adbbff}.panel{background:#1e2029;border:1px solid #353846;border-radius:16px;padding:22px;margin:20px 0}.layout{display:grid;grid-template-columns:1.4fr 1fr;gap:22px}label{display:block;margin:15px 0 7px}input,textarea,select{width:100%;padding:10px;border:1px solid #484c60;border-radius:8px;background:#151720;color:inherit;font:inherit}textarea{resize:vertical;min-height:90px}button{font:inherit;cursor:pointer;color:inherit;background:#354369;border:1px solid #6474ae;border-radius:8px;padding:10px 14px;margin:10px 8px 0 0}button:disabled{opacity:.5;cursor:wait}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{padding:10px;border-bottom:1px solid #393c49;text-align:left;white-space:nowrap}.notice{white-space:pre-wrap;line-height:1.7;color:#c0d0ff}.error{color:#ffb6c2}@media(max-width:750px){body{padding:16px}.layout{grid-template-columns:1fr}}</style>
<h1>人设与用户分配</h1><p>保存自己的角色预设，下次直接选择。<a href="/webui/" target="_top">返回 NapCat / 登录</a></p><p id="notice" class="notice" role="status">正在读取…</p>
<div class="layout"><section class="panel"><h2>人设库</h2><label for="choose">选择已有人设</label><select id="choose"></select><button id="new" type="button">新建空白预设</button><button id="copy" type="button">复制为新人设</button><p>已有内置角色会另存为个人预设，不改源码。填写有效名称和描述/性格后，停止输入约1秒自动保存；也可立即保存。</p><form id="editor"><div id="fields"></div><label for="base">继承外观/世界书的基础角色</label><select id="base"></select><button id="save" type="submit">立即保存人设</button></form><p id="save-state" class="notice"></p></section>
<section class="panel"><h2>按 QQ 分配人设</h2><label for="target">使用人设</label><select id="target"></select><label for="bot">适用 Bot 账号</label><input id="bot" list="bots" value="*" placeholder="* 表示所有Bot，或填Bot QQ号"><datalist id="bots"></datalist><label for="users">QQ用户号（可批量，每行一个）</label><textarea id="users" placeholder="123456789"></textarea><button id="assign" type="button">保存用户分配</button><p>只改变指定用户后续的私聊和群聊回应，不发测试消息。管理员分配优先于该用户的 /switch；解除后恢复分配前各会话的角色。不同人设的历史和记忆分别保留，切回可恢复。主动聊天使用同一人设。</p><h3>已保存的分配</h3><div class="scroll"><table><thead><tr><th>Bot</th><th>用户QQ</th><th>人设</th><th>操作</th></tr></thead><tbody id="bindings"></tbody></table></div></section></div>
<script>
'use strict';const $=id=>document.getElementById(id);const limits={name:80,description:6000,personality:6000,scenario:3000,first_mes:1000,mes_example:8000,system_prompt:6000};const labels={name:'人设名称',description:'身份与背景',personality:'性格、兴趣与说话习惯',scenario:'相处情境',first_mes:'初次见面台词（仅用于主动切换角色的开场）',mes_example:'对话示例',system_prompt:'补充人设指令（可选）'};
let state={revision:'',profiles:[],bindings:[]},catalog={cards:[],bot_ids:[]},selected='',editing=null,dirty=false,timer=null,busy=false,editVersion=0;
function note(text,error=false){$('notice').textContent=text;$('notice').classList.toggle('error',error);}
async function api(action,body){const token=localStorage.getItem('token');if(!token)throw Error('请先登录 NapCat');const r=await fetch('/api/Plugin/ext/napcat-plugin-anima-peer-manager/personas/'+action,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined,cache:'no-store'});const d=await r.json();if(!r.ok||d.code!==0)throw Error(d.message||'操作失败');return d.data;}
function all(){return [...catalog.cards.map(c=>({...c,builtin:true})),...state.profiles];}
function lists(){const choices=all();for(const id of ['choose','target']){const old=$(id).value;$(id).replaceChildren(...choices.map(c=>new Option((c.builtin?'内置 · ':'已保存 · ')+c.name,c.id)));if(choices.some(c=>c.id===old))$(id).value=old;}if(choices.some(c=>c.id===selected))$('choose').value=selected;const old=$('base').value;$('base').replaceChildren(new Option('不继承',''),...catalog.cards.map(c=>new Option(c.name,c.id)));if(catalog.cards.some(c=>c.id===old))$('base').value=old;$('bots').replaceChildren(...catalog.bot_ids.map(id=>new Option(id,id)));
$('bindings').replaceChildren();for(const b of state.bindings){const tr=document.createElement('tr');for(const t of [b.bot_id,b.user_id,choices.find(c=>c.id===b.persona_id)?.name||b.persona_id]){const td=document.createElement('td');td.textContent=t;tr.append(td);}const td=document.createElement('td'),button=document.createElement('button');button.textContent='解除分配';button.type='button';button.onclick=()=>run(async()=>{await save();state=await api('unbind',{revision:state.revision,bot_id:b.bot_id,users:b.user_id});lists();note('已解除；后续请求恢复分配前角色，记忆保留。');});td.append(button);tr.append(td);$('bindings').append(tr);}}
function edit(id){$('choose').value=id||'';const p=all().find(c=>c.id===id);selected=id||'';if(p)$('target').value=p.id;editing=p&&!p.builtin?p.id:null;for(const key of Object.keys(limits))$(key).value=p?.[key]||'';$('base').value=p?.base_card||(p?.builtin?p.id:catalog.cards[0]?.id||'');dirty=false;clearTimeout(timer);$('save-state').textContent=p?.builtin?'编辑内置角色后将另存为新预设。':p?'此预设已保存在云服务器。':'填写后将自动保存为新预设。';}
async function save(){clearTimeout(timer);if(!dirty)return;const version=editVersion,oldSelected=selected,oldTarget=$('target').value;if(!$('name').value.trim()||!($('description').value.trim()||$('personality').value.trim())){ $('save-state').textContent='请填写名称及角色描述或性格；当前尚未保存。';throw Error('人设尚不完整，未保存。');}const body={revision:state.revision,id:editing,base_card:$('base').value};for(const k of Object.keys(limits))body[k]=$(k).value;$('save-state').textContent='正在保存…';const d=await api('save',body);state=d;selected=d.saved_id;editing=selected;dirty=editVersion!==version;lists();$('choose').value=selected;if(!oldSelected||oldTarget===oldSelected)$('target').value=selected;$('save-state').textContent=dirty?'正在保存后续修改…':'已自动保存到云服务器，下次可从列表直接选择。';if(dirty)timer=setTimeout(()=>run(save),1200);}
async function run(fn){if(busy)return;busy=true;document.querySelectorAll('button,select,#bot,#users').forEach(e=>e.disabled=true);try{await fn();}catch(e){note(e.message,true);}finally{busy=false;document.querySelectorAll('button,select,#bot,#users').forEach(e=>e.disabled=false);}}
function changed(){editVersion++;dirty=true;clearTimeout(timer);$('save-state').textContent='有未保存修改…';if($('name').value.trim()&&($('description').value.trim()||$('personality').value.trim()))timer=setTimeout(()=>run(save),1200);}
for(const [key,max] of Object.entries(limits)){const label=document.createElement('label');label.htmlFor=key;label.textContent=labels[key];const input=document.createElement(key==='name'?'input':'textarea');input.id=key;input.maxLength=max;input.oninput=changed;$('fields').append(label,input);}$('base').onchange=changed;
$('choose').onchange=()=>{const next=$('choose').value;run(async()=>{try{await save();edit(next);lists();}catch(e){$('choose').value=selected;throw e;}});};$('new').onclick=()=>run(async()=>{await save();edit('');});$('copy').onclick=()=>run(async()=>{await save();editing=null;selected='';dirty=true;$('name').value+='（副本）';await save();});$('editor').onsubmit=e=>{e.preventDefault();run(save);};$('assign').onclick=()=>run(async()=>{await save();state=await api('assign',{revision:state.revision,bot_id:$('bot').value.trim(),users:$('users').value,persona_id:$('target').value});lists();note('用户分配已保存，后续请求自动使用指定人设，无需重启。');});
window.addEventListener('beforeunload',e=>{if(dirty||busy){e.preventDefault();e.returnValue='';}});
run(async()=>{state=await api('config');let offline=false;try{catalog=await api('catalog');}catch{offline=true;}lists();edit(state.profiles[0]?.id||catalog.cards[0]?.id||'');note(offline?'Bot角色目录暂不可用，仍可编辑已保存的人设。':'请选择或新建人设。内容自动保存，QQ分配需点击保存用户分配。',offline);});
</script></html>
