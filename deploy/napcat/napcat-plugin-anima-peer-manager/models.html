<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AnimaBot 模型提供商</title>
<style data-shared="base.css">
/* AnimaBot shared admin styles. Edit here, then run `node build-ui.mjs` to inline into every page. */
:root{
  color-scheme:light;
  --bg:#f5f6fa;--surface:#ffffff;--field:#ffffff;--line:#e2e6ee;--line-strong:#c3c9d6;
  --ink:#243044;--muted:#5b6578;--accent:#3f51c4;--accent-hover:#3442b0;--on-accent:#ffffff;
  --link:#3442b0;--button:#e9ecf7;--button-hover:#dde2f3;--danger:#b4233a;--ok:#1d7a52;
  --focus:#3f51c4;--toast:#243044;--on-toast:#ffffff;
  --radius:12px;--gap:20px;--page:1120px;
  font:15px/1.6 system-ui,"Microsoft YaHei","PingFang SC",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#14151b;--surface:#1e2029;--field:#171922;--line:#353846;--line-strong:#4a4e63;
  --ink:#ececf2;--muted:#b5b8c9;--accent:#3f55c4;--accent-hover:#4a61d4;--on-accent:#ffffff;
  --link:#aebdff;--button:#2c3142;--button-hover:#363c52;--danger:#ffb6c2;--ok:#8de5be;
  --focus:#8fa2ff;--toast:#ececf2;--on-toast:#14151b;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
main{max-width:var(--page);margin:auto;padding:28px 24px 96px}
h1{font-size:26px;margin:0 0 6px}h2{font-size:18px;margin:0 0 12px}h3{font-size:16px;margin:22px 0 6px}
p,small,.muted{color:var(--muted)}small{display:block;line-height:1.55;margin-top:4px}
a{color:var(--link)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;margin:var(--gap) 0}
label{display:block;margin:14px 0 6px}
label.check{display:flex;gap:10px;align-items:center}
input,textarea,select{font:inherit;color:inherit;background:var(--field);border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;width:100%;max-width:100%}
input[type=checkbox]{width:20px;height:20px;padding:0;flex:none;accent-color:var(--accent)}
textarea{min-height:96px;resize:vertical}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{font:inherit;cursor:pointer;color:var(--ink);background:var(--button);border:1px solid var(--line-strong);border-radius:8px;padding:9px 15px}
button:hover{background:var(--button-hover)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
button.primary:hover{background:var(--accent-hover)}
button.danger{color:var(--danger)}
button[aria-pressed="true"],button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
button:disabled{opacity:.55;cursor:not-allowed}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:18px}
.actions.sticky{position:sticky;bottom:0;z-index:2;background:var(--bg);margin:0 -24px;padding:12px 24px;border-top:1px solid var(--line)}
.dirty-flag{color:var(--muted);font-size:13px}
.dirty-flag[data-dirty="true"]{color:var(--danger)}
.scroll{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600}
td.wrap{white-space:normal;min-width:220px;overflow-wrap:anywhere}
details.help{margin-top:12px;color:var(--muted)}details.help summary{cursor:pointer;color:var(--ink)}
.badge{display:inline-block;border:1px solid var(--line-strong);border-radius:999px;padding:2px 10px;font-size:12px}
.badge.stale{color:var(--danger);border-color:currentColor}
.error-text{color:var(--danger)}
.hidden{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#ab-toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:10;display:flex;flex-direction:column;gap:8px;width:min(560px,calc(100% - 32px));pointer-events:none}
.toast{pointer-events:auto;display:flex;gap:12px;align-items:flex-start;background:var(--toast);color:var(--on-toast);border-radius:10px;padding:11px 14px;box-shadow:0 6px 24px rgba(0,0,0,.25);white-space:pre-wrap}
.toast.error{border-left:5px solid #e0455f}.toast.ok{border-left:5px solid #2fa36d}
.toast span{flex:1}
.toast button{background:transparent;color:inherit;border-color:currentColor;padding:3px 10px;font-size:13px}
@media (max-width:720px){
  main{padding:16px 16px 96px}.panel{padding:16px}.grid{grid-template-columns:1fr}
  .actions.sticky{margin:0 -16px;padding:10px 16px}
  table.stack thead{display:none}
  table.stack tr{display:block;border:1px solid var(--line);border-radius:10px;margin:0 0 10px;padding:6px 10px}
  table.stack td{display:flex;gap:12px;border:0;padding:4px 0}
  table.stack td::before{content:attr(data-label);color:var(--muted);flex:0 0 38%}
  table.stack td.wrap{min-width:0}
  table.stack td[colspan]::before{content:none}
}
</style>
<style>
header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:8px}
.pill{border:1px solid var(--ok);color:var(--ok);border-radius:999px;padding:8px 16px;font-size:13px}
.layout{display:grid;grid-template-columns:270px 1fr;gap:var(--gap);align-items:start}
.layout .panel{margin:0}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0 18px}
.profile{display:block;width:100%;text-align:left;margin-bottom:10px;overflow-wrap:anywhere}
.profile small{margin-top:4px}
.model-row{display:flex;gap:10px;align-items:end}.model-row>div{flex:1}
@media (max-width:760px){header{flex-direction:column;align-items:start}.layout{grid-template-columns:1fr}.model-row{flex-wrap:wrap}}
</style></head><body><main>
<header><div><h1>模型提供商</h1><p>保存你的 API 线路，自选模型，随时切换。<a href="/webui/" target="_top">返回 NapCat / 登录</a></p></div><div class="pill" id="active" role="status">正在读取配置…</div></header>
<div class="layout">
<aside class="panel" aria-labelledby="profiles-title">
  <h2 id="profiles-title">我的配置</h2>
  <div id="profiles" role="list"></div>
  <div class="actions"><button id="new" type="button">＋ 新建配置</button><button id="default" type="button">恢复部署默认</button></div>
  <small>切换影响后续聊天请求，无需重启。已发出的请求继续使用原配置。生图与语音接口保持独立。</small>
</aside>
<section class="panel" aria-labelledby="editor-title">
  <h2 id="editor-title">预设提供商</h2>
  <label for="search" class="sr-only">搜索提供商</label><input id="search" type="search" placeholder="搜索提供商…">
  <div class="cards" id="presets"></div>
  <form id="editor">
    <label for="name">配置名称</label><input id="name" maxlength="80" placeholder="例如：日常聊天备用">
    <label for="url">API 基址</label><input id="url" placeholder="https://api.example.com/v1" autocomplete="off" aria-describedby="urlhint"><small id="urlhint">支持 OpenAI Chat Completions 兼容接口。其他协议及订阅登录不适用。</small>
    <label for="key">API Key</label><input id="key" type="password" autocomplete="new-password" placeholder="输入 API Key" aria-describedby="keyhint"><small id="keyhint">密钥只保存在服务器私有文件，不在页面回显。</small>
    <div class="model-row"><div><label for="model">聊天模型</label><input id="model" list="model-options" maxlength="200" placeholder="拉取列表后选择，或手动填写模型 ID" aria-describedby="modelhint"><datalist id="model-options"></datalist></div><button id="fetch" type="button">拉取模型列表</button></div>
    <small id="modelhint">列表可能包含非聊天模型，请选择支持聊天的模型。拉取列表不等同于验证聊天权限。</small>
    <div class="actions"><button class="primary" id="apply" type="submit">保存并启用</button><button id="save" type="button">仅保存</button><button id="activate" type="button">启用已保存配置</button><button class="danger" id="delete" type="button">删除配置</button><span id="dirty" class="dirty-flag" aria-live="polite"></span></div>
  </form>
</section>
</div>
</main>
<script data-shared="base.js">
// AnimaBot shared admin helpers. Edit here, then run `node build-ui.mjs` to inline into every page.
'use strict';
window.AB = (() => {
  const $ = id => document.getElementById(id);

  class ApiError extends Error {
    constructor(message, status = 0) { super(message); this.status = status; }
  }

  // fetch + JSON with readable Chinese errors for network failures, HTML error pages and expired logins.
  async function request(url, {method, body, headers = {}} = {}) {
    let response;
    try {
      response = await fetch(url, {method: method || (body === undefined ? 'GET' : 'POST'), cache: 'no-store',
        headers: {'Content-Type': 'application/json', ...headers}, body: body === undefined ? undefined : JSON.stringify(body)});
    } catch {
      throw new ApiError('无法连接服务器，请确认服务正在运行、网络正常后重试。');
    }
    const text = await response.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { /* non-JSON, e.g. a proxy error page */ }
    return {response, data};
  }

  // Client for this plugin's NapCat routes; the NapCat WebUI keeps its login token in localStorage.
  function napcat(base) {
    return async (path, body) => {
      let token = null;
      try { token = localStorage.getItem('token'); } catch { /* storage blocked */ }
      if (!token) throw new ApiError('请先返回 NapCat 登录，再重新打开本页面。', 401);
      const {response, data} = await request(base + path, {body, headers: {Authorization: 'Bearer ' + token}});
      if (response.status === 401 || data?.code === -1) throw new ApiError('登录已过期，请点击上方链接重新登录 NapCat，再从扩展页面进入。', 401);
      if (!data) throw new ApiError(`服务器返回了无法识别的内容（HTTP ${response.status}），请刷新页面；若持续出现请查看 NapCat 日志。`, response.status);
      if (!response.ok || data.code !== 0) throw new ApiError(data.message || `操作失败（HTTP ${response.status}）`, response.status);
      return data.data;
    };
  }

  // Toasts sit at the bottom of the viewport so results are visible however far the page is scrolled.
  let toastRoot = null;
  function toast(message, kind = 'info', {action} = {}) {
    if (!toastRoot) {
      toastRoot = document.createElement('div');
      toastRoot.id = 'ab-toasts';
      document.body.append(toastRoot);
    }
    toastRoot.replaceChildren();
    const box = document.createElement('div');
    box.className = 'toast ' + kind;
    box.setAttribute('role', kind === 'error' ? 'alert' : 'status');
    const text = document.createElement('span');
    text.textContent = message;
    box.append(text);
    if (action) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = action.label;
      b.onclick = () => { box.remove(); action.run(); };
      box.append(b);
    }
    const close = document.createElement('button');
    close.type = 'button'; close.textContent = '关闭'; close.setAttribute('aria-label', '关闭提示');
    close.onclick = () => box.remove();
    box.append(close);
    toastRoot.append(box);
    if (kind === 'ok') setTimeout(() => box.remove(), 5000);
  }
  const ok = message => toast(message, 'ok');
  function error(err, reload) {
    const message = err?.message || String(err);
    toast(message, 'error', err?.status === 409 && reload ? {action: {label: '重新读取', run: reload}} : undefined);
  }

  // One action at a time. Buttons are disabled while it runs; form fields stay usable so focus is never lost.
  function runner({onError} = {}) {
    let busy = false;
    const run = async fn => {
      if (busy) return false;
      busy = true;
      document.body.setAttribute('aria-busy', 'true');
      const buttons = [...document.querySelectorAll('button:not([data-free])')].filter(b => !b.disabled);
      buttons.forEach(b => { b.disabled = true; });
      try { await fn(); return true; }
      catch (err) { (onError || error)(err); return false; }
      finally {
        busy = false;
        document.body.removeAttribute('aria-busy');
        buttons.forEach(b => { b.disabled = false; });
      }
    };
    run.busy = () => busy;
    return run;
  }

  // Poll while the tab is visible, never overlapping requests.
  function poll(fn, ms) {
    let inFlight = false;
    const tick = async () => {
      if (inFlight || document.hidden) return;
      inFlight = true;
      try { await fn(); } finally { inFlight = false; }
    };
    setInterval(tick, ms);
    document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });
    tick();
    return tick;
  }

  // Rebuild a <select> only when its options really changed, so an open dropdown is not closed by polling.
  function setOptions(select, items, fallback = '') {
    const signature = JSON.stringify(items.map(i => [i.value, i.label]));
    if (select.dataset.signature !== signature) {
      const old = select.value;
      select.replaceChildren(...items.map(i => new Option(i.label, i.value)));
      select.dataset.signature = signature;
      select.value = items.some(i => i.value === old) ? old : fallback;
    }
    return select.value;
  }

  // Update table cells in place (text selection and scroll survive refreshes). Rows are arrays of text,
  // or {empty: text} for a single full-width message row. `labels` feed the narrow-screen card layout.
  function setRows(tbody, rows, {labels = [], wrap = []} = {}) {
    rows.forEach((row, index) => {
      let tr = tbody.rows[index];
      const cells = row.empty !== undefined ? [row.empty] : row;
      if (!tr || tr.cells.length !== cells.length) {
        const fresh = document.createElement('tr');
        cells.forEach((_, i) => {
          const td = document.createElement('td');
          if (row.empty !== undefined) td.colSpan = labels.length || 1;
          else { if (labels[i]) td.dataset.label = labels[i]; if (wrap.includes(i)) td.className = 'wrap'; }
          fresh.append(td);
        });
        tr ? tr.replaceWith(fresh) : tbody.append(fresh);
        tr = fresh;
      }
      cells.forEach((value, i) => {
        const text = value ?? '—';
        const td = tr.cells[i];
        if (td.textContent !== String(text)) td.textContent = text;
      });
    });
    while (tbody.rows.length > rows.length) tbody.deleteRow(-1);
  }

  // Assign text only when it changed, so periodic refreshes do not reset the user's text selection.
  function setText(el, text) { if (el.textContent !== text) el.textContent = text; }

  const pad = n => String(n).padStart(2, '0');
  function duration(seconds) {
    const n = Math.max(0, Math.ceil(seconds));
    if (!n) return '已到期';
    const h = Math.floor(n / 3600), m = Math.floor(n % 3600 / 60), s = n % 60;
    return (h ? h + '时' : '') + (h || m ? m + '分' : '') + s + '秒';
  }
  const stamp = seconds => seconds ? new Date(seconds * 1000).toLocaleString() : '—';

  // Unsaved-change tracking: marks the flag element, warns before leaving or replacing the form.
  function dirtyTracker(flag) {
    let dirty = false;
    const show = () => {
      if (!flag) return;
      flag.dataset.dirty = String(dirty);
      flag.textContent = dirty ? '有未保存的修改' : '已与服务器同步';
    };
    window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
    show();
    return {
      get dirty() { return dirty; },
      mark() { if (!dirty) { dirty = true; show(); } },
      clear() { dirty = false; show(); },
      watch(root) { root.addEventListener('input', () => this.mark()); root.addEventListener('change', () => this.mark()); },
      confirmDiscard(message = '有未保存的修改，继续将丢失这些修改。确定继续吗？') { return !dirty || confirm(message); },
    };
  }

  return {$, ApiError, request, napcat, toast, ok, error, runner, poll, setOptions, setRows, setText, duration, stamp, pad, dirtyTracker};
})();
</script>
<script>
'use strict';
const {$, napcat, ok, error, runner, toast, dirtyTracker} = AB;
const api = napcat('/api/Plugin/ext/napcat-plugin-anima-peer-manager/models/');
let state = {profiles: [], presets: [], revision: '', active: null}, selected = null;
const dirty = dirtyTracker($('dirty'));
const run = runner({onError: err => { if ($('active').textContent === '正在读取配置…') $('active').textContent = '尚未连接'; error(err, reload); }});

function button(text, fn, cls = '') {
  const b = document.createElement('button');
  b.type = 'button'; b.textContent = text; b.className = cls; b.onclick = fn;
  return b;
}
function syncButtons() {
  // Disabled state is re-derived after every action (the runner restores buttons it disabled).
  for (const id of ['activate', 'delete']) $(id).disabled = !selected;
  $('activate').title = $('delete').title = selected ? '' : '请先在左侧选择一个已保存的配置';
}
function render() {
  const active = state.profiles.find(p => p.id === state.active);
  $('active').textContent = active ? '使用中：' + active.name + ' · ' + active.model : '使用中：部署默认配置';
  $('profiles').replaceChildren(...state.profiles.map(p => {
    const b = button((p.id === state.active ? '● ' : '') + p.name, () => choose(p), 'profile');
    b.setAttribute('role', 'listitem');
    if (p.id === selected) b.setAttribute('aria-current', 'true');
    if (p.id === state.active) b.setAttribute('aria-label', p.name + '（使用中）');
    const s = document.createElement('small'); s.textContent = p.model; b.append(s);
    return b;
  }));
  const q = $('search').value.trim().toLowerCase();
  $('presets').replaceChildren(...state.presets.filter(p => p.name.toLowerCase().includes(q)).map(p =>
    button(p.name, () => usePreset(p))));
  syncButtons();
}
function fill(p) {
  selected = p?.id || null;
  for (const [id, k] of [['name', 'name'], ['url', 'base_url'], ['model', 'model']]) $(id).value = p?.[k] || '';
  $('key').value = '';
  $('keyhint').textContent = p?.has_key ? '已保存密钥；留空保留。更换 API 地址时必须重新填写密钥。' : '密钥只保存在服务器私有文件，不在页面回显。';
  $('model-options').replaceChildren();
  dirty.clear();
  render();
}
// Picking another profile or preset replaces the form; never silently drop a typed key or edits.
function choose(p) { if (dirty.confirmDiscard('表单中有未保存的修改（可能包括刚输入的密钥），切换后会丢失。确定继续吗？')) fill(p); }
function usePreset(p) {
  if (!dirty.confirmDiscard('表单中有未保存的修改（可能包括刚输入的密钥），使用预设会覆盖它们。确定继续吗？')) return;
  fill(null); $('name').value = p.name; $('url').value = p.base_url; dirty.mark();
  $('key').focus();
  toast('已填入 ' + p.name + ' 的地址，请输入密钥并拉取模型。');
}
const draft = () => ({id: selected, revision: state.revision, name: $('name').value, base_url: $('url').value, api_key: $('key').value, model: $('model').value});
async function refresh() { state = await api('config'); render(); }
function reload() {
  if (!dirty.confirmDiscard('重新读取会丢弃表单中尚未保存的修改。确定继续吗？')) return;
  run(async () => { await refresh(); fill(state.profiles.find(p => p.id === selected)); ok('已重新读取。'); });
}
async function save(activate) {
  const result = await api('save', draft());
  $('key').value = ''; selected = result.saved_id; state = {...state, ...result};
  if (activate) state = {...state, ...await api('activate', {id: selected, revision: state.revision})};
  await refresh();
  fill(state.profiles.find(p => p.id === selected));
  ok(activate ? '已启用，下一条聊天请求使用此模型。' : '已保存；尚未切换当前模型。');
}

dirty.watch($('editor'));
$('search').oninput = render;
$('new').onclick = () => { if (dirty.confirmDiscard()) { fill(null); $('name').focus(); toast('请选择提供商或填写自定义地址。'); } };
$('editor').onsubmit = e => { e.preventDefault(); run(() => save(true)).then(syncButtons); };
$('save').onclick = () => run(() => save(false)).then(syncButtons);
$('fetch').onclick = () => run(async () => {
  toast('正在从提供商拉取模型…');
  const models = await api('list', draft());
  $('model-options').replaceChildren(...models.map(id => { const o = document.createElement('option'); o.value = id; return o; }));
  if (!$('model').value && models.length === 1) { $('model').value = models[0]; dirty.mark(); }
  ok('已获取 ' + models.length + ' 个模型，点击模型输入框选择或输入搜索。');
}).then(syncButtons);
$('activate').onclick = () => run(async () => {
  if (!selected) throw new Error('请先在左侧选择已保存的配置。');
  const p = state.profiles.find(p => p.id === selected);
  if (dirty.dirty && !confirm('启用的是已保存的「' + p.name + '」，表单中未保存的修改不会生效。继续吗？')) return;
  await api('activate', {id: selected, revision: state.revision});
  await refresh();
  ok('已切换到「' + p.name + '」。');
}).then(syncButtons);
$('default').onclick = () => {
  if (!confirm('恢复部署默认会立即把后续聊天请求切回部署时配置的模型。确定吗？')) return;
  run(async () => { await api('activate', {id: null, revision: state.revision}); await refresh(); ok('已恢复原部署配置。'); }).then(syncButtons);
};
$('delete').onclick = () => run(async () => {
  if (!selected) throw new Error('请先在左侧选择配置。');
  const p = state.profiles.find(p => p.id === selected);
  if (!confirm('删除「' + p.name + '」及保存在服务器的密钥？此操作无法撤销。')) return;
  await api('delete', {id: selected, revision: state.revision});
  selected = null; await refresh(); fill(null);
  ok('已删除。');
}).then(syncButtons);
run(async () => { await refresh(); fill(state.profiles.find(p => p.id === state.active)); }).then(syncButtons);
</script></body></html>
