name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Unit tests (offline; model calls are mocked or served by local fixtures)
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/ci_report.py

  napcat-plugin:
    name: NapCat plugin and admin pages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/napcat/napcat-plugin-anima-peer-manager
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node build-ui.mjs --check
      - run: npm test

  launchers:
    name: One-click launcher on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      ANIMABOT_NO_START: "1"   # check Python, create .venv, install, verify config; do not start the bot
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pretend the setup wizard has run
        shell: bash
        run: printf 'LLM_API_KEY=ci\nLLM_BASE_URL=https://api.deepseek.com\nLLM_MODEL=deepseek-flash\n' > .env
      - name: Windows launcher (一键启动机器人.bat)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bat = Get-ChildItem -Filter *.bat | Select-Object -First 1
          cmd /c "`"$($bat.FullName)`" < NUL"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .venv\Scripts\python.exe -c "import nonebot, openai, PIL; print('dependencies ok')"
      - name: Linux launcher (start.sh)
        if: runner.os == 'Linux'
        run: |
          ./start.sh
          .venv/bin/python -c "import nonebot, openai, PIL; print('dependencies ok')"
      - name: Second run reuses the environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bat = Get-ChildItem -Filter *.bat | Select-Object -First 1
          cmd /c "`"$($bat.FullName)`" < NUL"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Second run reuses the environment (Linux)
        if: runner.os == 'Linux'
        run: ./start.sh

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t animabot:ci .
      - name: Image starts and the setup wizard runs
        run: |
          set +e
          docker run --rm animabot:ci python tools/setup_wizard.py --check
          code=$?
          # 2 = "not configured yet", which is what a fresh image should report.
          test "$code" -eq 2
