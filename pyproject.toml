[tool.poetry]
name = "qq_use_bot"
version = "0.3.4"
description = "QQ role companion with API-key models, persistent role memories and ComfyUI"
authors = ["AnimaBot"]

[tool.poetry.dependencies]
python = "^3.10"
nonebot2 = {extras = ["fastapi", "httpx"], version = "^2.3.0"}
nonebot-adapter-onebot = "^2.4.3"
openai = ">=1.14.0,<3.0.0"
aiohttp = "^3.9.3"
httpx = ">=0.27,<1"
python-dotenv = "^1.0.1"
Pillow = ">=10.4.0,<13.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
